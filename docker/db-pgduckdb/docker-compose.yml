# https://github.com/duckdb/pg_duckdb
services:
  postgres:
    image: pgduckdb/pgduckdb:${POSTGRESQL_VERSION:-17}-${PG_DUCKDB_VERSION:-main}
    # build:
    #   context: .
    #   args:
    #     POSTGRES_VERSION: ${POSTGRESQL_VERSION:-17}
    #     PG_DUCKDB_VERSION: ${PG_DUCKDB_VERSION:-main}
    #     DUCKDB_VERSION: ${DUCKDB_VERSION:-}
    #container_name: postgres
    hostname: database
    restart: always
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - $PWD/db/data:/var/lib/postgresql/data
      - $PWD/db/init:/docker-entrypoint-initdb.d/
      # Ossie semantic models (YAML/JSON) for ossie_load()
      - $PWD/models:/models:ro
    environment:
      POSTGRES_USER: ${ADMIN_USER:-root}
      POSTGRES_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ## During INIT, allows to bootstrap an empty database for all user creation
      POSTGRES_DB: ${DB_NAME:-postgres}
      APP_DB_SCHEMA: ${APP_DB_SCHEMA:-public}
      APP_DB_NAME: ${APP_DB_NAME:-db}
      APP_DB_USER: ${APP_USER:-user}
      APP_DB_PASS: ${APP_PASSWORD:-pass}
      ## MotherDuck cloud analytics integration (optional)
      MOTHERDUCK_TOKEN: ${MOTHERDUCK_TOKEN:-}
      # https://www.postgresql.org/docs/current/auth-trust.html
      POSTGRES_HOST_AUTH_METHOD: trust # allow all connections without a password. This is *not* recommended for prod
    # Performance tuning recommended for analytical heavy-lifting
    shm_size: '2gb'
    networks:
      - network
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${DB_NAME:-postgres}", "-U", "${ADMIN_USER:-root}" ]
      timeout: 45s
      interval: 10s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:5.1
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_UI_LOGIN:-admin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${ADMIN_UI_PASSWORD:-admin}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: ${ADMIN_UI_REQUIRE_PASSWORD:-False}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - ${DB_UI_PORT:-8008}:80
    depends_on:
      - postgres
    networks:
      - network

networks:
  network:
    driver: bridge
